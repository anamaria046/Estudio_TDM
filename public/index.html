    <h1>Gestión de Items</h1>

    <form id="itemForm">
        <input type="text" id="name" placeholder="Nombre del item" required>
        <input type="text" id="description" placeholder="Descripción">
        <div class="form-actions">
            <button type="submit" id="submitBtn">Agregar</button>
            <button type="button" id="cancelBtn" class="btn-cancel" style="display: none;">Cancelar</button>
        </div>
    </form>

    <div id="itemsContainer" class="card-grid">
        <!-- Aquí se van a renderizar las tarjetas de gestión -->
    </div>
